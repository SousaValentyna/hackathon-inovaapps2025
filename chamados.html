<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajuda.Ai — Chamados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell container">
    <div class="d-flex flex-column gap-4">

      <!-- Topbar -->
      <header class="topbar bg-white rounded shadow-sm p-3 mb-3">
        <div class="d-flex align-items-center justify-content-between">
          <div class="brand-compact d-flex align-items-center">
            <div style="width:46px; height:46px; display:grid; place-items:center;">
                <a href="home.html">
                  <img src="images/logo.png" 
                       alt="Logo Ajuda.Ai" 
                       style="padding:6px; width:46px; height:46px; object-fit:cover; background:#0a1a33; border-radius:12px;">
                </a>
              </div>
            <div class="ms-2 d-none d-md-block">
              <div style="font-weight:700">Ajuda.Ai</div>
              <small class="text-muted">Central de Suporte</small>
            </div>
          </div>

          <nav class="">
                        <ul class="nav" role="tablist">
                            <li class="nav-item">
                            <a class="nav-link px-3 py-2" href="home.html">
                                <i class="bi bi-house-door me-1"></i>
                                <span class="d-none d-sm-inline">Home</span>
                            </a>
                            </li>
                            
                            <li class="nav-item">
                            <a class="nav-link px-3 py-2" href="chat.html">
                                <i class="bi bi-chat-dots me-1"></i>
                                <span class="d-none d-sm-inline">Chat</span>
                            </a>
                            </li>
                            <li class="nav-item">
                            <a class="nav-link px-3 py-2 active" href="chamados.html">
                                <i class="bi bi-list-ul me-1"></i>
                                <span class="d-none d-sm-inline">Chamados</span>
                                <span id="badge-count" class="badge bg-secondary ms-2 d-none d-sm-inline">0</span>
                            </a>
                            </li>
                            <li class="nav-item">
                            <a class="nav-link px-3 py-2" href="dashboard.html">
                                <i class="bi bi-bar-chart-line me-1"></i>
                                <span class="d-none d-sm-inline">Indicadores</span>
                            </a>
                            </li>
                        </ul>
                        </nav>

          
        </div>
      </header>

      <!-- Tickets List -->
      <div id="screen-list">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="m-0">Meus chamados</h5>
          <div class="d-flex gap-2">
            <input id="search-tickets" class="form-control form-control-sm search-input" placeholder="Buscar por título, id ou categoria" />
            <select id="filter-status" class="form-select form-select-sm" style="width:150px;">
              <option value="Todos">Todos</option>
              <option value="Aberto">Aberto</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Fechado">Fechados</option>
            </select>
          </div>
        </div>
        <div id="tickets-list" class="list-group"></div>
        <div id="no-tickets" class="no-data text-center p-4 d-none">Nenhum chamado encontrado.</div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/chamadosScript.js"></script>
</body>
</html>
