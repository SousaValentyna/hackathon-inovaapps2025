<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suporte — Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>

</head>
<body>
  <div class="app-shell container">
    <div class="d-flex flex-column gap-2">

      <!-- Topbar -->
      <header class="topbar bg-white rounded shadow-sm p-3 mb-3">
        <div class="d-flex align-items-center justify-content-between">
          <div class="brand-compact d-flex align-items-center">
            <div style="width:46px; height:46px; display:grid; place-items:center;">
                <img src="images/logo.png" 
                     alt="Logo Solve.Ai" 
                     style="padding:6px; width:46px; height:46px; object-fit:cover; background:#0a1a33; border-radius:12px;">
              </div>
            <div class="ms-2 d-none d-md-block">
              <div style="font-weight:700">Solve.Ai</div>
              <small class="text-muted">Central de Suporte</small>
            </div>
          </div>

          <nav class="">
            <ul class="nav" role="tablist">
              <li class="nav-item">
                <a class="nav-link px-3 py-2 active" href="index.html">
                  <i class="bi bi-chat-dots me-1"></i>
                  <span class="d-none d-sm-inline">Chat</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3 py-2" href="chamados.html">
                  <i class="bi bi-list-ul me-1"></i>
                  <span class="d-none d-sm-inline">Chamados</span>
                  <span id="badge-count" class="badge bg-secondary ms-2 d-none d-sm-inline">0</span>
                </a>
              </li>
            </ul>
          </nav>

          
        </div>
      </header>

      <!-- Chat card -->
      <div class="card card-chat shadow-sm">
        <div class="card-body d-flex flex-column p-0">
          <!-- Chat header inside card -->
          <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
            <div class="d-flex align-items-center gap-3">
                <img src="images/robot.png" 
                     alt="Logo Solve.Ai" 
                     style="padding:6px; width:46px; height:46px; object-fit:cover; background:#eef5ff; border-radius:12px;">
             
              <div>
                <div style="font-weight:700">Assistente Virtual</div>
                <small id="chat-subtitle" class="text-muted">Descreva seu problema no chat — a IA tentará ajudar.</small>
              </div>
            </div>
        
          </div>

          <!-- Messages -->
          <div class="messages bg-light" id="messages"></div>

          <!-- Footer (input) -->
          <div class="chat-footer bg-white">
            <div class="row g-2 align-items-center">
              <div class="col">
                <input id="input-message" class="form-control" placeholder="Escreva uma mensagem... (press Enter para enviar)" />
              </div>
              <div class="col-auto">
                <button id="btn-send" class="btn btn-primary">Enviar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- <script src="js/front.js"></script> -->
  <script src="js\script.js"></script>

</body>
</html>
