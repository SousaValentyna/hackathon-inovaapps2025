<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suporte — Chat / Abrir Chamado</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{ --accent:#556ee6; --muted:#6c757d; }
    html, body { height: 100%; }
    body{ min-height:100%; display:flex; flex-direction:column; background: linear-gradient(180deg, #f7f8fb 0%, #eef3ff 100%); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .app-shell{ max-width:1100px; margin:0 auto; padding:28px 16px; min-height:100vh; display:flex; flex-direction:column; }
    .app-shell > .d-flex{ flex:1; gap:24px; align-items:stretch; }

    /* Topbar */
    .topbar{ width:100%; }
    .topbar .nav{ gap:6px; }
    .topbar .nav-link{ color:rgba(15,23,42,0.7); border-radius:10px; transition:all .18s ease; }
    .topbar .nav-link:hover{ background:rgba(85,110,230,0.06); color:var(--accent); }
    .topbar .nav-link.active{ color:var(--accent); background:rgba(85,110,230,0.08); box-shadow:inset 0 -2px 0 0 var(--accent); font-weight:600; }

    .sidebar{ min-width:220px; }
    .card-chat{ flex:1; display:flex; flex-direction:column; border-radius:14px; overflow:hidden; box-shadow:0 6px 18px rgba(15,23,42,0.06); }
    .messages{
      height: calc(100vh - 200px); /* altura ajustada para caber no viewport considerando header e footer */
      overflow-y:auto; /* barra de rolagem vertical interna */
      padding:1.1rem;
      padding-bottom:1.6rem;
      background:linear-gradient(180deg,#ffffff, #fbfdff);
    }
    .msg{ max-width:78%; margin-bottom:.7rem; padding:.6rem .9rem; border-radius:12px; box-shadow:0 1px 0 rgba(15,23,42,0.03); font-size:0.95rem; line-height:1.35; }
    .msg.user{ margin-left:auto; background:linear-gradient(90deg,var(--accent), #2d5be8); color:#fff; border-bottom-right-radius:6px; }
    .msg.ai{ background:#ffffff; color:#1f2937; border:1px solid rgba(86,103,204,0.06); }
    .chat-footer{ padding:0.75rem; border-top:1px solid rgba(15,23,42,0.04); background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.95)); position:sticky; bottom:0; z-index:3; }
    .ticket-pill{ font-size:.82rem; padding:.28rem .6rem; border-radius:999px; display:inline-block; }
    .ticket-pending{ background:#fff4e5; color:#7a5a00; }
    .ticket-closed{ background:#dfeee6; color:#0f5132; }
    .nav-link.active{ color:var(--accent) !important; font-weight:600; }
    .search-input{ max-width:420px; }
    .no-data{ color:var(--muted); }
    .sidebar .nav{ padding-left:0; }
    .brand-compact{ display:flex; align-items:center; gap:.5rem; }
    .brand-compact svg{ border-radius:10px; }

    @media (max-width: 991px){
      .app-shell{ padding:18px 12px; }
      .app-shell > .d-flex{ gap:16px; }
      .messages{ padding-bottom:1.8rem; }
      .topbar .brand-compact .ms-2{ display:none; }
      .topbar .nav { gap:4px; }
    }
    @media (max-width: 767px){
      .sidebar{ display:none; }
      .app-shell{ padding:12px 10px; }
      .app-shell > .d-flex{ gap:12px; }
      .card-chat{ border-radius:10px; }
      .messages{ padding-bottom:2.4rem; }
      .chat-footer{ padding:0.5rem; }
      .search-input{ max-width:140px; }
      .topbar .nav-link span{ display:none; }
      #badge-count{ display:none; }
    }
  </style>
</head>
<body>
  <div class="app-shell container">
    <div class="d-flex flex-column gap-4">
      <!-- Sidebar / Nav -->
      <header class="topbar bg-white rounded shadow-sm p-3 mb-3">
        <div class="d-flex align-items-center justify-content-between">
          <div class="brand-compact d-flex align-items-center">
            <div style="width:46px; height:46px; display:grid; place-items:center;">
              <svg width="46" height="46" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
                <rect width="64" height="64" rx="12" fill="var(--accent)"/>
                <path d="M18 38c4-6 22-6 26 0v6H18v-6z" fill="#fff" opacity="0.95"/>
                <circle cx="24" cy="24" r="3.5" fill="#fff"/>
                <circle cx="40" cy="24" r="3.5" fill="#fff"/>
              </svg>
            </div>
            <div class="ms-2 d-none d-md-block">
              <div style="font-weight:700">Suporte</div>
              <small class="text-muted">Painel do solicitante</small>
            </div>
          </div>

          <nav class="mx-auto">
            <ul class="nav" role="tablist">
              <li class="nav-item">
                <a class="nav-link px-3 py-2 active" href="#" data-target="chat" role="tab">
                  <i class="bi bi-chat-dots me-1"></i>
                  <span class="d-none d-sm-inline">Chat</span>
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3 py-2" href="#" data-target="list" role="tab">
                  <i class="bi bi-list-ul me-1"></i>
                  <span class="d-none d-sm-inline">Chamados</span>
                  <span id="badge-count" class="badge bg-secondary ms-2 d-none d-sm-inline">0</span>
                </a>
              </li>
            </ul>
          </nav>

          <div class="d-flex align-items-center gap-2">
            <div class="d-none d-md-flex align-items-center small text-muted">Você está logado como <strong class="ms-1">Solicitante</strong></div>
            <div style="width:36px; height:36px; display:grid; place-items:center; background:#eef3ff; border-radius:8px; color:var(--accent); font-weight:700;">S</div>
          </div>
        </div>
      </header>

      <!-- Main area -->
      <div class="flex-grow-1">
        <!-- Header -->
        <!-- Chat card -->
        <div class="card card-chat shadow-sm">
          <div class="card-body d-flex flex-column p-0">
            <!-- Chat header inside card -->
            <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
              <div class="d-flex align-items-center gap-3">
                <div style="width:48px; height:48px; background:#eef5ff; display:grid; place-items:center; border-radius:10px; color:var(--accent); font-weight:700">U</div>
                <div>
                  <div style="font-weight:700">Solicitante</div>
                  <small id="chat-subtitle" class="text-muted">Descreva seu problema no chat — a IA tentará ajudar.</small>
                </div>
              </div>
              <div class="d-flex align-items-center gap-2">
                <select id="category-select" class="form-select form-select-sm" style="width:200px;">
                  <option value="">Categoria (opcional)</option>
                  <option>Suporte Técnico</option>
                  <option>Conta e Acesso</option>
                  <option>Financeiro</option>
                  <option>Outros</option>
                </select>
                <span id="ticket-status-area"></span>
              </div>
            </div>

            <!-- Messages -->
            <div class="messages bg-light" id="messages"></div>

            <!-- Footer (input) -->
            <div class="chat-footer bg-white">
              <div class="row g-2 align-items-center">
                <div class="col">
                  <input id="input-message" class="form-control" placeholder="Escreva uma mensagem... (press Enter para enviar)" />
                </div>
                <div class="col-auto">
                  <button id="btn-send" class="btn btn-primary">Enviar</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Placeholder for other screens (open/list/details) -->
        <div id="screens" class="mt-4">
          <!-- Lista de chamados -->
          <div id="screen-list" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="m-0">Meus chamados</h5>
              <div class="d-flex gap-2">
                <input id="search-tickets" class="form-control form-control-sm search-input" placeholder="Buscar por título, id ou categoria" />
                <select id="filter-status" class="form-select form-select-sm" style="width:150px;">
                  <option value="all">Todos</option>
                  <option value="pending">Pendentes</option>
                  <option value="open">Em andamento</option>
                  <option value="closed">Fechados</option>
                </select>
              </div>
            </div>
            <div id="tickets-list" class="list-group"></div>
            <div id="no-tickets" class="no-data text-center p-4 d-none">Nenhum chamado encontrado.</div>
          </div>

          <!-- Detalhes do chamado (modal será usado) -->
        </div>

      </div>
    </div>
  </div>

  <!-- Ticket Detail Modal -->
  <div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalhes do chamado <small id="modal-ticket-id" class="text-muted"></small></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-8">
              <h6 id="modal-ticket-title"></h6>
              <p id="modal-ticket-desc" class="text-muted"></p>
              <div id="modal-chat-history" style="max-height:40vh; overflow:auto; border-top:1px dashed #e9ecef; padding-top:.5rem;"></div>
            </div>
            <div class="col-md-4">
              <ul class="list-group">
                <li class="list-group-item"><strong>ID:</strong> <span id="modal-id"></span></li>
                <li class="list-group-item"><strong>Abertura:</strong> <span id="modal-opened-by">Solicitante</span></li>
                <li class="list-group-item"><strong>Categoria:</strong> <span id="modal-category"></span></li>
                <li class="list-group-item"><strong>Área:</strong> <span id="modal-area">Suporte</span></li>
                <li class="list-group-item"><strong>Status:</strong> <span id="modal-status" class="ticket-pill"></span></li>
              </ul>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Simple SPA navigation
    // select nav links in the topbar and any other place that uses data-target
    const navLinks = document.querySelectorAll('header .nav-link[data-target], .nav-link[data-target]');
    const screens = {
      chat: document.querySelector('.card-chat'),
      list: document.getElementById('screen-list')
    };

    function setActiveNav(target, pushState = true){
      // update active class on nav links
      navLinks.forEach(a => {
        const isActive = a.dataset.target === target;
        a.classList.toggle('active', isActive);
        a.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      // show/hide screens
      Object.keys(screens).forEach(k => {
        const el = screens[k];
        if(!el) return;
        if(k === target) el.classList.remove('d-none'); else el.classList.add('d-none');
      });

      // update URL hash for deep-linking (optional)
      if(pushState){
        try{ history.replaceState(null, '', `#${target}`); }catch(e){}
      }
    }

    // attach click handlers
    navLinks.forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const target = a.dataset.target;
        if(!target) return;
        setActiveNav(target, true);
      });
    });

    // support hash navigation
    window.addEventListener('hashchange', () => {
      const h = location.hash.replace('#','') || 'chat';
      setActiveNav(h, false);
    });

    // determine initial tab from hash or default to chat
    const initialHash = location.hash.replace('#','');
    const initialTab = (initialHash && Object.keys(screens).includes(initialHash)) ? initialHash : 'chat';
    // ensure screens hidden/shown accordingly
    setActiveNav(initialTab, false);

    // Chat mechanics
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input-message');
    const btnSend = document.getElementById('btn-send');
    const categorySelect = document.getElementById('category-select');

    let chatHistory = [];
    let autoOpenThreshold = 2; // after N failed answers, open ticket
    let failCounter = 0;

    function addMessage(text, who='ai'){
      const div = document.createElement('div');
      div.className = 'msg ' + (who === 'user' ? 'user' : 'ai');
      div.innerText = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      chatHistory.push({who,text,ts: new Date().toISOString()});
    }

    function clearChat(){
      messagesEl.innerHTML = '';
      chatHistory = [];
      failCounter = 0;
      updateTicketBadge();
      document.getElementById('ticket-status-area').innerHTML = '';
    }

    function simulateAIReply(userText){
      // simplistic simulation: if message contains 'erro' or 'não funciona' then AI 'fail'
      return new Promise(resolve=>{
        setTimeout(()=>{
          const lowered = userText.toLowerCase();
          if(lowered.includes('não') || lowered.includes('erro') || lowered.includes('falha') || lowered.includes('bug')){
            resolve({solved:false, reply:'Sinto muito — parece um problema que precisa de atenção humana. Posso abrir um chamado para você? Vou avaliar.'});
          }
          else if(lowered.includes('como') || lowered.includes('como faço') || lowered.includes('ajuda')){
            resolve({solved:true, reply:'Aqui está um passo a passo rápido que pode ajudar: 1) Verifique a conexão 2) Reinicie o app 3) Se persistir, me avise.'});
          }
          else{
            // random small chance to fail
            if(Math.random() < 0.15){
              resolve({solved:false, reply:'Não consegui resolver automaticamente. Deseja que eu abra um chamado?'});
            } else {
              resolve({solved:true, reply:'Tente este procedimento e me diga se funcionou.'});
            }
          }
        }, 800 + Math.random()*600);
      });
    }

    async function handleSend(){
      const text = input.value.trim();
      if(!text) return;
      addMessage(text, 'user');
      input.value = '';

      const ai = await simulateAIReply(text);
      addMessage(ai.reply, 'ai');

      if(!ai.solved){
        failCounter++;
      } else {
        failCounter = Math.max(0, failCounter-1);
      }

      // If failures exceed threshold, open ticket automatically
      if(failCounter > autoOpenThreshold){
        const ticket = createTicketFromChat();
        showTicketCreated(ticket);
      }
    }

    btnSend.addEventListener('click', handleSend);
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); handleSend(); } });

    // Tickets store (localStorage for prototype)
    function loadTickets(){
      try{ return JSON.parse(localStorage.getItem('tickets_v1')||'[]'); }catch(e){ return []; }
    }
    function saveTickets(list){ localStorage.setItem('tickets_v1', JSON.stringify(list)); updateTicketBadge(); }

    function createTicketFromChat(){
      const tickets = loadTickets();
      const id = 'CH-' + Date.now().toString().slice(-6);
      const ticket = {
        id,
        title: (chatHistory[0] && chatHistory[0].text.slice(0,80)) || 'Chamado gerado via chat',
        description: chatHistory.map(m=>`[${m.who}] ${m.text}`).join('\n'),
        category: categorySelect.value || 'Outros',
        area: 'Suporte Técnico',
        status: 'pending',
        openedBy: 'Solicitante',
        createdAt: new Date().toISOString(),
        chat: [...chatHistory]
      };
      tickets.unshift(ticket);
      saveTickets(tickets);
      return ticket;
    }

    function showTicketCreated(ticket){
      // show pill in header and notification
      document.getElementById('ticket-status-area').innerHTML = `<span class=\"ticket-pill ticket-pending\">Chamado aberto: ${ticket.id}</span>`;
      renderTicketsList();
      // small toast-like inline message
      const badge = document.getElementById('badge-count');
      badge.classList.remove('bg-secondary'); badge.classList.add('bg-danger');
      setTimeout(()=>{ badge.classList.remove('bg-danger'); badge.classList.add('bg-secondary'); }, 1500);
    }

    // Render tickets
    function renderTicketsList(){
      const listEl = document.getElementById('tickets-list');
      const noEl = document.getElementById('no-tickets');
      const tickets = loadTickets();
      const q = document.getElementById('search-tickets').value.trim().toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      const filtered = tickets.filter(t=>{
        if(statusFilter !== 'all'){
          if(statusFilter === 'pending' && t.status !== 'pending') return false;
          if(statusFilter === 'open' && t.status !== 'open') return false;
          if(statusFilter === 'closed' && t.status !== 'closed') return false;
        }
        if(!q) return true;
        return t.id.toLowerCase().includes(q) || (t.title && t.title.toLowerCase().includes(q)) || (t.category && t.category.toLowerCase().includes(q));
      });
      listEl.innerHTML = '';
      if(filtered.length === 0){ noEl.classList.remove('d-none'); } else { noEl.classList.add('d-none'); }
      filtered.forEach(t=>{
        const item = document.createElement('a');
        item.href='#'; item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-start';
        item.innerHTML = `<div>
            <div class=\"fw-bold\">${t.title}</div>
            <div class=\"text-muted small\">${t.category} • ${new Date(t.createdAt).toLocaleString()}</div>
          </div>
          <div class=\"text-end\">
            <div class=\"small mb-1\">ID: ${t.id}</div>
            <div>${renderStatusPill(t.status)}</div>
          </div>`;
        item.addEventListener('click', (e)=>{ e.preventDefault(); openTicketModal(t.id); });
        listEl.appendChild(item);
      });
      updateTicketBadge();
    }

    function renderStatusPill(status){
      if(status === 'pending') return `<span class='ticket-pill ticket-pending'>Pendente</span>`;
      if(status === 'closed') return `<span class='ticket-pill ticket-closed'>Fechado</span>`;
      return `<span class='ticket-pill' style='background:#e7f3ff;color:#0b2b5a;'>Em andamento</span>`;
    }

    function updateTicketBadge(){
      const tickets = loadTickets();
      const count = tickets.length;
      document.getElementById('badge-count').innerText = count;
    }

    // Open modal
    const ticketModal = new bootstrap.Modal(document.getElementById('ticketModal'));
    function openTicketModal(id){
      const tickets = loadTickets();
      const t = tickets.find(x=> x.id === id);
      if(!t) return;
      document.getElementById('modal-ticket-id').innerText = t.id;
      document.getElementById('modal-ticket-title').innerText = t.title;
      document.getElementById('modal-ticket-desc').innerText = t.description;
      document.getElementById('modal-category').innerText = t.category;
      document.getElementById('modal-status').innerHTML = renderStatusPill(t.status);
      document.getElementById('modal-id').innerText = t.id;
      const historyEl = document.getElementById('modal-chat-history');
      historyEl.innerHTML = '';
      (t.chat || []).forEach(m=>{
        const p = document.createElement('div'); p.className = m.who === 'user' ? 'text-end small mb-2' : 'small mb-2';
        p.innerHTML = `<strong>${m.who === 'user' ? 'Você' : 'Agente'}</strong>: ${m.text}`;
        historyEl.appendChild(p);
      });
      ticketModal.show();
    }

    // Filters and search handlers
    document.getElementById('search-tickets').addEventListener('input', renderTicketsList);
    document.getElementById('filter-status').addEventListener('change', renderTicketsList);

    // initial
    (function init(){
      // ensure chat visible
      setActiveNav('chat');
      renderTicketsList();
      // load previous chat if any (optional)
    })();

    // How to integrate a real IA later:
    // replace simulateAIReply(userText) with a function that calls your backend/AI and returns { solved: boolean, reply: string }

  </script>
</body>
</html>
